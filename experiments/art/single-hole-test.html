<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Single Hole Art Test</title>
<style>
  @font-face {
    font-family: 'Departure Mono';
    src: url('../../assets/fonts/DepartureMono-Regular.woff2') format('woff2'),
         url('../../assets/fonts/DepartureMono-Regular.woff') format('woff');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #f0dfc0; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Load game scripts -->
<script src="/src/shared.js"></script>
<script src="/src/worlds/desert-planet.js"></script>
<script src="/src/level-design.js"></script>
<script src="/src/modes/desert-golfing.js"></script>

<script>
// ── Load the hole art image ──────────────────────────────
const _holeImg = new Image();
_holeImg.src = 'anothertest.jpg';
let _holeImgReady = false;
_holeImg.onload = () => { _holeImgReady = true; };

// ── Override terrain drawing: image IS the terrain ───────
// Hide the normal flat-color terrain fill entirely.
// The image provides all visuals; collision is invisible.
drawTerrainDG = function() {
  // Don't draw any terrain fill — the background image handles it
};

// ── Override sky drawing: use the image instead ──────────
const _origDrawSky = MODE.drawSky;
MODE.drawSky = function() {
  if (!_holeImgReady) {
    _origDrawSky();
    return;
  }
  // Draw the image scaled to fill the game viewport
  // The image aspect ratio may differ from the viewport,
  // so we cover the full width and let height crop naturally
  const imgAspect = _holeImg.naturalWidth / _holeImg.naturalHeight;
  const viewAspect = W / H;

  let drawW, drawH, drawX, drawY;
  if (viewAspect > imgAspect) {
    // Viewport is wider than image — fit width, crop height
    drawW = W;
    drawH = W / imgAspect;
    drawX = 0;
    drawY = 0; // anchor to top
  } else {
    // Viewport is taller than image — fit height, crop width
    drawH = H;
    drawW = H * imgAspect;
    drawX = (W - drawW) / 2;
    drawY = 0;
  }
  ctx.drawImage(_holeImg, drawX, drawY, drawW, drawH);
};

// ── Hand-place terrain vertices to trace the dune edge ───
// These are in game coordinates (W~1060, H=540)
// Traced from the image: the dune surface line
// The image shows: left side rises gently, peaks around 55-60% across,
// dips into a valley around 65%, rises to a small plateau at 80% where the cup sits
HAND_DEFINED_HOLES[0] = {
  teeY: 310,
  dist: 880,
  cupY: 205,
  verts: [
    { dx: -50,  y: 340 },   // off-screen left, below frame
    { dx: 0,    y: 320 },   // left edge
    { dx: 80,   y: 305 },   // gentle rise
    { dx: 160,  y: 288 },   // climbing the dune
    { dx: 240,  y: 268 },   // steeper climb
    { dx: 320,  y: 245 },   // approaching peak
    { dx: 380,  y: 225 },   // near peak
    { dx: 430,  y: 212 },   // peak of the dune
    { dx: 470,  y: 218 },   // slight dip after peak
    { dx: 520,  y: 240 },   // descending into valley
    { dx: 570,  y: 265 },   // valley bottom
    { dx: 610,  y: 255 },   // rising out of valley
    { dx: 660,  y: 232 },   // second rise
    { dx: 720,  y: 215 },   // approaching cup plateau
    { dx: 780,  y: 208 },   // cup area
    // cup will be placed at dx ~820
    { dx: 860,  y: 205 },   // after cup
    { dx: 920,  y: 210 },   // trailing off right
    { dx: 980,  y: 225 },   // off-screen right
  ]
};
</script>

<!-- Load rendering + gameplay -->
<script src="/src/art.js"></script>
<script src="/src/gameplay.js"></script>
<script src="/src/debug.js"></script>

<!-- Inline main.js — skip Firebase, single hole -->
<script>
let _gameLoopRunning = false;
function gameLoop() {
  _ballLogFrame++;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
function ensureGameLoop() {
  if (_gameLoopRunning) return;
  _gameLoopRunning = true;
  gameLoop();
}

const DEFAULT_GAME_SEED = 42;
if (!localStorage.getItem('dg-seed')) {
  localStorage.setItem('dg-seed', String(DEFAULT_GAME_SEED));
}

// Start the course — this will use HAND_DEFINED_HOLES[0]
startCourse('desert-world-1', 'desert-course-1');

// Position ball at the tee
const hole = holes[0];
ball.x = hole.teeX;
ball.y = terrainYAt(hole.teeX) - BALL_RADIUS;
ball.atRest = true;
setHoleCamera(hole);

ensureGameLoop();
</script>
</body>
</html>
