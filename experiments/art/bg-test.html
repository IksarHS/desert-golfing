<!DOCTYPE html>

<head>

    src: url('../../assets/fonts/DepartureMono-Regular.woff2') format('woff2'),

    font-display: swap;
  }

    font: 11px 'Departure Mono', monospace;
    color: rgba(255,255,255,0.3);
    pointer-events: none; z-index: 100;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="branch-label">BG ART TEST</div>

<!-- ── BG Art Test Overrides ─────────────────────────────── -->
<script>
// ============================================================
// BACKGROUND IMAGE CONFIG — change this path to your image
// ============================================================
const BG_IMAGE_SRC = 'bg-test-image.jpg';

// ── Load background image ──────────────────────────────────
const bgImage = new Image();
let bgImageLoaded = false;
bgImage.onload = () => { bgImageLoaded = true; };
bgImage.onerror = () => { console.warn('BG image not found at:', BG_IMAGE_SRC, '— using fallback gradient'); };
bgImage.src = BG_IMAGE_SRC;

// ── Override: hide terrain, flag, cup — image provides all visuals ──

// Don't draw terrain fill — draw a thin red debug line instead so we can align
drawTerrainDG = function() {
  ctx.strokeStyle = 'rgba(255, 0, 0, 0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < vertices.length - 1; i++) {
    const a = vertices[i];
    const b = vertices[i + 1];
    if (i === 0) ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
  }
  ctx.stroke();
};

// Don't draw our flag — the image has its own flag
drawFlag = function() { /* invisible */ };

// Don't draw cup fill — image handles it
drawCupFill = function() { /* invisible */ };

// Don't draw cup outline
if (typeof drawCup === 'function') drawCup = function() {};

// ── Override terrain Y to match image grass line ──────────
// The image's grass surface is at roughly 78% from top of viewport
// Override terrainYAt to return a flat line at that height
const IMAGE_GRASS_Y_RATIO = 0.66;
const _origTerrainYAt = terrainYAt;
const _origInit = MODE.init;
MODE.init = function() {
  _origInit.call(this);
  // After init generates terrain, override all vertex Y positions
  // to match the image grass line (flat terrain matching image)
  const grassY = Math.round(H * IMAGE_GRASS_Y_RATIO);
  for (let i = 0; i < vertices.length; i++) {
    vertices[i].y = grassY;
  }
  // Reposition ball on the new flat terrain
  ball.y = grassY - BALL_RADIUS;
  // Reposition cup to match image flag position (~68% from left)
  const hole = holes[0];
  if (hole) {
    const cupX = Math.round(W * 0.68);
    // Move cup vertices
    hole.cupX = cupX;
    hole.cupY = grassY;
  }
};

// ── Override: sky → background image ────────────────────────
// Image ball position (approximate) — we'll paint over it
const IMG_BALL_X_RATIO = 0.045;  // ~4.5% from left
const IMG_BALL_Y_RATIO = 0.92;  // ~92% from top

MODE.drawSky = function() {
  if (bgImageLoaded) {
    // Draw background image stretched to fill the game viewport
    ctx.drawImage(bgImage, 0, 0, W, H);

    // Paint over the image's original ball with surrounding grass color
    const bx = Math.round(W * IMG_BALL_X_RATIO);
    const by = Math.round(H * IMG_BALL_Y_RATIO);
    // Layer grass-colored patches to hide the ball
    ctx.fillStyle = '#3a6e1e';
    ctx.fillRect(bx - 18, by - 18, 36, 36);
    ctx.fillStyle = '#4d8c2a';
    ctx.fillRect(bx - 15, by - 14, 30, 28);
    ctx.fillStyle = '#5a9a32';
    ctx.fillRect(bx - 12, by - 10, 24, 10);
    ctx.fillStyle = '#3d7820';
    ctx.fillRect(bx - 12, by, 24, 14);
  } else {
    // Fallback: gentle sky gradient (blue-ish, not desert orange)
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#87CEEB');   // light sky blue
    grad.addColorStop(0.6, '#B0D4E8'); // pale blue
    grad.addColorStop(1, '#D4E8D0');   // hint of green near horizon
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
};
</script>

<script src="../../src/main.js"></script>
</body>
</html>
