<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Art Course Test</title>
<style>
  @font-face {
    font-family: 'Departure Mono';
    src: url('../../assets/fonts/DepartureMono-Regular.woff2') format('woff2'),
         url('../../assets/fonts/DepartureMono-Regular.woff') format('woff');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #1a1a1a; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Load game scripts -->
<script src="/src/shared.js"></script>
<script src="/src/reference-holes.js"></script>
<script src="/src/worlds/desert-planet.js"></script>
<script src="/src/worlds/grasslands.js"></script>
<script src="/src/worlds/classic-collection.js"></script>
<script src="/src/worlds/dramatic-depths.js"></script>
<script src="/src/level-design.js"></script>
<script src="/src/generators/midgame.js"></script>
<script src="/src/generators/dramatic.js"></script>
<script src="/src/modes/desert-golfing.js"></script>

<script>
// ── Art Course: 1 hole with AI-generated terrain art ──────

// Art hole vertex data (auto-extracted from hole-1.png)
var ART_COURSE_HOLES = [
  { teeY: 268, dist: 808, cupY: 384,
    verts: [
      { dx: 0, y: 268 }, { dx: 30, y: 264 }, { dx: 52, y: 279 }, { dx: 68, y: 280 },
      { dx: 70, y: 269 }, { dx: 76, y: 269 }, { dx: 88, y: 245 }, { dx: 94, y: 259 },
      { dx: 108, y: 228 }, { dx: 116, y: 248 }, { dx: 126, y: 252 }, { dx: 140, y: 286 },
      { dx: 154, y: 268 }, { dx: 180, y: 294 }, { dx: 202, y: 297 }, { dx: 234, y: 312 },
      { dx: 254, y: 314 }, { dx: 270, y: 325 }, { dx: 442, y: 290 }, { dx: 464, y: 339 },
      { dx: 478, y: 352 }, { dx: 492, y: 355 }, { dx: 524, y: 379 }, { dx: 538, y: 361 },
      { dx: 554, y: 355 }, { dx: 578, y: 358 }, { dx: 594, y: 354 }, { dx: 620, y: 365 },
      { dx: 638, y: 361 }, { dx: 652, y: 375 }, { dx: 676, y: 365 }, { dx: 682, y: 370 },
      { dx: 696, y: 407 }, { dx: 704, y: 396 }, { dx: 710, y: 395 }, { dx: 716, y: 403 },
      { dx: 734, y: 399 }, { dx: 750, y: 383 }, { dx: 772, y: 374 }, { dx: 780, y: 374 },
      { dx: 792, y: 385 }, { dx: 808, y: 384 }, { dx: 852, y: 358 }, { dx: 870, y: 353 },
      { dx: 892, y: 374 }, { dx: 906, y: 375 }, { dx: 926, y: 386 }, { dx: 940, y: 381 },
      { dx: 958, y: 386 }
    ]
  },
];

// Register the art course
WORLDS['art-test'] = {
  name: 'Art Test',
  system: 'Art System',
  sky: '#d5ad72',
  materials: ['sand'],
  defaultMaterial: 'sand',
  assets: [],
  courses: {},
};
WORLDS['art-test'].courses['art-hole-1'] = {
  name: 'Art Hole 1',
  materials: ['sand'],
  archetypes: null,
  difficultyRange: [0.0, 0.5],
  holeCount: 1,
  handDefinedSource: 'ART_COURSE_HOLES',
};

// ── Load the art image ──────────────────────────────────
const _artImages = {};
const _artImg1 = new Image();
_artImg1.src = 'art-holes/hole-1.png';
_artImg1.onload = () => { _artImages[0] = _artImg1; };

// ── Override terrain rendering: use art image ───────────
const _origDrawTerrainDG = drawTerrainDG;
drawTerrainDG = function() {
  const holeImg = _artImages[currentHole];
  if (!holeImg) {
    // No art for this hole — use normal rendering
    _origDrawTerrainDG();
    return;
  }
  // Draw the art image clipped to the terrain polygon
  const startX = camera.x - 50;
  const endX = camera.x + W + 50;

  // Build terrain clip path
  ctx.save();
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < vertices.length; i++) {
    const v = vertices[i];
    if (v.x < startX - 100 && i < vertices.length - 1 && vertices[i+1].x < startX - 100) continue;
    if (v.x > endX + 100) break;
    if (!started) { ctx.moveTo(v.x, v.y); started = true; }
    else ctx.lineTo(v.x, v.y);
  }
  // Close along the bottom
  ctx.lineTo(endX + 100, H + 300);
  ctx.lineTo(startX - 100, H + 300);
  ctx.closePath();
  ctx.clip();

  // Draw the art image inside the clip
  // The image is 960x540 and maps to the hole's world coordinates
  const hole = holes[currentHole];
  if (hole) {
    const imgX = hole.teeX - 40; // offset to align tee with left edge of image
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(holeImg, imgX, 0, 960, 540);
    ctx.imageSmoothingEnabled = true;
  }

  ctx.restore();
};

// ── Override sky: draw sky portion of the art image ──────
const _origDrawSky = MODE.drawSky;
MODE.drawSky = function() {
  const holeImg = _artImages[currentHole];
  if (!holeImg) {
    _origDrawSky();
    return;
  }
  // Draw the full art image as the background (sky + distant terrain)
  const hole = holes[currentHole];
  if (hole) {
    const imgX = hole.teeX - 40;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(holeImg, imgX, 0, 960, 540);
    ctx.imageSmoothingEnabled = true;
  }
};
</script>

<!-- Load rendering + gameplay + debug -->
<script src="/src/art.js"></script>
<script src="/src/gameplay.js"></script>
<script src="/src/debug.js"></script>

<!-- Start the game -->
<script>
let _gameLoopRunning = false;
function gameLoop() {
  _ballLogFrame++;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
function ensureGameLoop() {
  if (_gameLoopRunning) return;
  _gameLoopRunning = true;
  gameLoop();
}

const DEFAULT_GAME_SEED = 42;
if (!localStorage.getItem('dg-seed')) {
  localStorage.setItem('dg-seed', String(DEFAULT_GAME_SEED));
}

// Start the art course
startCourse('art-test', 'art-hole-1');
const hole = holes[0];
ball.x = hole.teeX;
ball.y = terrainYAt(hole.teeX) - BALL_RADIUS;
ball.atRest = true;
setHoleCamera(hole);
ensureGameLoop();
</script>
</body>
</html>
