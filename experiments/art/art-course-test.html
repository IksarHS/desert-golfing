<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Art Course Test</title>
<style>
  @font-face {
    font-family: 'Departure Mono';
    src: url('../../assets/fonts/DepartureMono-Regular.woff2') format('woff2'),
         url('../../assets/fonts/DepartureMono-Regular.woff') format('woff');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #1a1a1a; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Load game scripts -->
<script src="/src/shared.js"></script>
<script src="/src/reference-holes.js"></script>
<script src="/src/worlds/desert-planet.js"></script>
<script src="/src/worlds/grasslands.js"></script>
<script src="/src/worlds/classic-collection.js"></script>
<script src="/src/worlds/dramatic-depths.js"></script>
<script src="/src/level-design.js"></script>
<script src="/src/generators/midgame.js"></script>
<script src="/src/generators/dramatic.js"></script>
<script src="/src/modes/desert-golfing.js"></script>

<script>
// ── Art Course: 1 hole with AI-generated terrain art ──────

// Art hole vertex data (auto-extracted from hole-1.png)
// Vertices placed visually using tools/place-vertices.html
var ART_COURSE_HOLES = [
  { teeY: 330, dist: 860, cupY: 358,
    verts: [
      { dx: 0, y: 330 },
      { dx: 60, y: 320 },
      { dx: 120, y: 308 },
      { dx: 180, y: 290 },
      { dx: 240, y: 268 },
      { dx: 300, y: 245 },
      { dx: 340, y: 230 },
      { dx: 370, y: 222 },
      { dx: 400, y: 238 },
      { dx: 440, y: 252 },
      { dx: 500, y: 283 },
      { dx: 560, y: 303 },
      { dx: 620, y: 318 },
      { dx: 680, y: 330 },
      { dx: 740, y: 340 },
      { dx: 800, y: 350 },
      { dx: 860, y: 358 },
      { dx: 920, y: 364 },
      { dx: 958, y: 368 }
    ]
  },
];

// Register the art course
WORLDS['art-test'] = {
  name: 'Art Test',
  system: 'Art System',
  sky: '#d5ad72',
  materials: ['sand'],
  defaultMaterial: 'sand',
  assets: [],
  courses: {},
};
WORLDS['art-test'].courses['art-hole-1'] = {
  name: 'Art Hole 1',
  materials: ['sand'],
  archetypes: null,
  difficultyRange: [0.0, 0.5],
  holeCount: 1,
  handDefinedSource: 'ART_COURSE_HOLES',
};

// ── Load the art image ──────────────────────────────────
const _artImages = {};
const _artImg1 = new Image();
_artImg1.src = 'art-holes/hole-1.png';
_artImg1.onload = () => { _artImages[0] = _artImg1; };

// ── Override terrain rendering: INVISIBLE ─────────────────
// The art image provides ALL visuals. Terrain polygon is collision-only.
drawTerrainDG = function() {
  // Don't draw anything — the image handles all terrain visuals
};

// ── Override sky: draw the FULL art image as the entire background ──
const _origDrawSky = MODE.drawSky;
MODE.drawSky = function() {
  const holeImg = _artImages[currentHole];
  if (!holeImg) {
    _origDrawSky();
    return;
  }
  // Draw the art image scaled to fill the full game viewport
  // The image is the complete scene: sky + background + terrain
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(holeImg, 0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
};
</script>

<!-- Load rendering + gameplay + debug -->
<script src="/src/art.js"></script>
<script src="/src/gameplay.js"></script>
<script src="/src/debug.js"></script>

<!-- Start the game -->
<script>
let _gameLoopRunning = false;
function gameLoop() {
  _ballLogFrame++;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
function ensureGameLoop() {
  if (_gameLoopRunning) return;
  _gameLoopRunning = true;
  gameLoop();
}

const DEFAULT_GAME_SEED = 42;
if (!localStorage.getItem('dg-seed')) {
  localStorage.setItem('dg-seed', String(DEFAULT_GAME_SEED));
}

// Start the art course
startCourse('art-test', 'art-hole-1');
const hole = holes[0];
ball.x = hole.teeX;
ball.y = terrainYAt(hole.teeX) - BALL_RADIUS;
ball.atRest = true;
setHoleCamera(hole);
ensureGameLoop();
</script>
</body>
</html>
