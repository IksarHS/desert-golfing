          const isVertHover = oi === ed.hoverObject && vi === ed.hoverObjectVert;

          ctx.beginPath();
          ctx.arc(v.x, v.y, HANDLE_RADIUS * invZ, 0, Math.PI * 2);

          if (isVertSelected) {
            ctx.fillStyle = 'rgba(232, 200, 64, 0.9)';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2 * invZ;
            ctx.stroke();
          } else if (isVertHover) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1 * invZ;
            ctx.stroke();
          } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1 * invZ;
            ctx.stroke();
          }
        }
      } else {
        // Resize mode (default, click to select): show bounding box + resize handles
        const bb = getObjectAABB(oi);
        // Dashed bounding box
        ctx.strokeStyle = 'rgba(100, 180, 255, 0.5)';
        ctx.lineWidth = 1 * invZ;
        ctx.setLineDash([4 * invZ, 4 * invZ]);
        ctx.strokeRect(bb.minX, bb.minY, bb.maxX - bb.minX, bb.maxY - bb.minY);
        ctx.setLineDash([]);

        // 8 resize handles (squares)
        for (const h of RESIZE_HANDLES) {
          const pos = h.getPos(bb);
          const isHov = ed.hoverResizeHandle === h.id;
          const s = (isHov ? RESIZE_HANDLE_SIZE + 1 : RESIZE_HANDLE_SIZE) * invZ;

          ctx.fillStyle = isHov ? '#66bbff' : 'rgba(100, 180, 255, 0.9)';
          ctx.fillRect(pos.x - s, pos.y - s, s * 2, s * 2);
          ctx.strokeStyle = '#234';
          ctx.lineWidth = 1 * invZ;
          ctx.strokeRect(pos.x - s, pos.y - s, s * 2, s * 2);
        }

        // Rotation handle — circle above top-center
        const rotPos = getRotationHandlePos(bb, invZ);
        const topCenter = { x: (bb.minX + bb.maxX) / 2, y: bb.minY };
        const rotR = (ed.hoverRotHandle ? HANDLE_RADIUS + 1 : HANDLE_RADIUS) * invZ;

        // Stem line from top-center to rotation handle
        ctx.strokeStyle = 'rgba(100, 220, 100, 0.6)';
        ctx.lineWidth = 1.5 * invZ;
        ctx.beginPath();
        ctx.moveTo(topCenter.x, topCenter.y);
        ctx.lineTo(rotPos.x, rotPos.y);
        ctx.stroke();

        // Circle handle
        ctx.fillStyle = ed.hoverRotHandle ? '#88ff88' : 'rgba(100, 220, 100, 0.9)';
        ctx.beginPath();
        ctx.arc(rotPos.x, rotPos.y, rotR, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#234';
        ctx.lineWidth = 1 * invZ;
        ctx.stroke();
      }
    }
    } // end if (editMode)
  }

  // Only draw terrain/cup handles in edit mode
  if (!editMode) { ctx.restore(); ctx.restore(); return; }

  // Draw terrain vertex handles for current hole (skip cup vertices)
  const range = getHoleVertexRange(currentHole);
  const cupVerts = getCupVertexIndices(currentHole);
  for (let i = range.start; i <= range.end; i++) {
    if (cupVerts.includes(i)) continue; // cup vertices hidden — use cup marker instead
    const v = vertices[i];
    if (!v) continue;
    const isSelected = i === ed.selectedVert;
    const isHover = i === ed.hoverVert;

    ctx.beginPath();
    ctx.arc(v.x, v.y, HANDLE_RADIUS * invZ, 0, Math.PI * 2);

    if (isSelected) {
      ctx.fillStyle = 'rgba(232, 200, 64, 0.9)';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2 * invZ;
      ctx.stroke();
    } else if (isHover) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1 * invZ;
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 1 * invZ;
      ctx.stroke();
    }

    // Show material indicator on selected terrain vertex
    if (isSelected && vertices[i].mat && vertices[i].mat !== 'sand') {
      const matColor = MATERIALS[vertices[i].mat].color;
      ctx.fillStyle = matColor;
      ctx.fillRect(v.x - 4 * invZ, v.y - 14 * invZ, 8 * invZ, 4 * invZ);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 0.5 * invZ;
      ctx.strokeRect(v.x - 4 * invZ, v.y - 14 * invZ, 8 * invZ, 4 * invZ);
    }
  }

  // Draw tee marker
  const hole = holes[currentHole];
  if (hole) {
    const teeY = terrainYAt(hole.teeX);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = "9px 'Departure Mono', monospace";
    ctx.textAlign = 'center';
    ctx.fillText('T', hole.teeX, teeY - 12);

    // Cup marker
    ctx.fillStyle = '#e8c840';
    ctx.beginPath();
    ctx.arc(hole.cupX, hole.cupY, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.font = "8px 'Departure Mono', monospace";
    ctx.textAlign = 'center';
    ctx.fillText('C', hole.cupX, hole.cupY + 3);

    // Show archetype + difficulty near the tee (edit mode only)
    if (ed.mode === 'edit') {
      const diff = typeof getDifficulty === 'function' ? getDifficulty(currentHole).toFixed(2) : '?';
      const arch = hole.archetype || 'hand-defined';
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = "9px 'Departure Mono', monospace";
      ctx.textAlign = 'left';
      ctx.fillText(`${arch}  d=${diff}`, hole.teeX + 30, teeY - 12);
    }
  }

  // ── Knife Tool Preview ──────────────────────────────────
  if (ed.knifeActive && ed.knifeStart && ed.knifePreviewEnd) {
    const a = ed.knifeStart, b = ed.knifePreviewEnd;
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.sqrt(dx * dx + dy * dy);

    if (len > 0.1) {
      // Extended dashed line (the infinite cut plane)
      const extend = 2000;
      const ex = dx / len * extend, ey = dy / len * extend;
      ctx.beginPath();
      ctx.moveTo(a.x - ex, a.y - ey);
      ctx.lineTo(a.x + ex, a.y + ey);
      ctx.strokeStyle = 'rgba(255, 80, 80, 0.35)';
      ctx.lineWidth = 1;
      ctx.setLineDash([8, 6]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Solid segment between clicks
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Start point marker
    ctx.beginPath();
    ctx.arc(a.x, a.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4444';
    ctx.fill();

    // Intersection preview dots on target object
    if (ed.knifeTargetObject >= 0 && len > 0.1) {
      const obj = objects[ed.knifeTargetObject];
      if (obj) {
        for (let i = 0; i < obj.verts.length; i++) {
          const j = (i + 1) % obj.verts.length;
          const hit = lineSegmentIntersect(a, b, obj.verts[i], obj.verts[j]);
          if (hit) {
            ctx.beginPath();
            ctx.arc(hit.point.x, hit.point.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc00';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }
      }
    }
  }

  ctx.restore(); // world space
  ctx.restore(); // displayScale
}

// ── Editor Game Loop ──────────────────────────────────────
// ── Serialize / Save ─────────────────────────────────────
function serializeHole(holeIdx) {
  const hole = holes[holeIdx];
  if (!hole) return null;

  const teeX = hole.teeX;
  const startX = teeX + 40;
  const cupX = hole.cupX;

  // Collect cup vertex X bounds so we can exclude them
  const cupLeftBound = hole.cupLeftX - 21; // flatMargin(20) + 1
  const cupRightBound = hole.cupRightX + 21;

  // Find terrain vertices between tee and cup, excluding cup vertices and background
  const midVerts = [];
  for (let i = 0; i < vertices.length; i++) {
    const v = vertices[i];
    if (v.x <= startX) continue;            // before playable area
    if (v.x >= cupLeftBound) break;         // at or past cup zone
    const entry = { dx: Math.round(v.x - startX), y: Math.round(v.y) };
    if (v.mat && v.mat !== 'sand') entry.mat = v.mat;
    midVerts.push(entry);
  }

  const def = {
    teeY: Math.round(hole.teeY),
    dist: Math.round(cupX - teeX),
    cupY: Math.round(hole.cupY),
    verts: midVerts,
  };

  // Include cup material if non-default
  if (hole.cupMat && hole.cupMat !== 'sand') def.cupMat = hole.cupMat;

  // Collect objects belonging to this hole
  const holeObjects = objects.filter(ov => ov.holeIndex === holeIdx);
  if (holeObjects.length > 0) {
    def.objects = holeObjects.map(ov => {
      const o = {
        mat: ov.mat,
        verts: ov.verts.map(v => ({ dx: Math.round(v.x - startX), y: Math.round(v.y) }))
      };
      if (ov.sprite) o.sprite = ov.sprite;
      if (ov.rotation) o.rotation = ov.rotation;
      return o;
    });
  }

  return def;
}

function serializeAllCustomHoles() {
  const obj = {};
  for (const idx of customHoleIndices) {
    if (idx < holes.length) {
      const def = serializeHole(idx);
      if (def) {
        // Include name and libraryRef from customHoleMeta
        const meta = customHoleMeta[idx];
        if (meta) {
          if (meta.name) def.name = meta.name;
          if (meta.libraryRef) def.libraryRef = meta.libraryRef;
        }
        obj[String(idx)] = def;
      }
    }
  }
  return obj;
}

function saveCustomHoles() {
  const holeData = serializeAllCustomHoles();
  const wId = document.getElementById('world-picker')?.value || 'desert-planet';
  const cId = document.getElementById('course-picker')?.value || 'barren-flats';

  // Build course data object
  const courseData = {
    worldId: wId,
    courseId: cId,
    holeCount: editorHoleCount,
    courseName: document.getElementById('course-name')?.value || '',
    holes: holeData,
    objects: objects.filter(o => customHoleIndices.has(o.holeIndex)).map(o => ({ verts: o.verts, mat: o.mat, sprite: o.sprite, rotation: o.rotation, holeIndex: o.holeIndex })),
  };

  // Save to server (source of truth — file on disk, committable to git)
  const filename = `data/courses/${wId}--${cId}.json`;
  fetch('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ file: filename, data: courseData }),
  }).then(r => r.json()).then(result => {
    if (result.ok) {
      console.log(`Saved to ${result.path}`);
    } else {
      console.error('Server save failed:', result.error);
    }
  }).catch(err => {
    console.error('Server save failed (is server.js running?):', err.message);
  });

  // Also save to localStorage as a fast cache
  localStorage.setItem(courseStorageKey(), JSON.stringify(courseData));
  localStorage.setItem('desert-golfing-custom-holes', JSON.stringify(holeData));
  localStorage.setItem('dg-active-course', JSON.stringify({ worldId: wId, courseId: cId }));
  invalidateCustomHolesCache();

  // Visual feedback
  const btn = document.getElementById('btn-save');
  btn.textContent = 'Saved!';
  btn.style.background = '#4a4';
  setTimeout(() => { btn.textContent = 'Save'; btn.style.background = ''; }, 1200);
  console.log('Saved', Object.keys(holeData).length, 'custom holes');
}

function clearCustomHoles() {
  localStorage.removeItem(courseStorageKey());
  localStorage.removeItem('desert-golfing-custom-holes');
  invalidateCustomHolesCache();
  // Reset to defaults
  customHoleIndices.clear();
  customHoleMeta = {};
  nextCustomNumber = 1;
  editorHoleCount = getCourseHoleCount(currentCourse);
  // Re-mark hand-defined holes as custom
  for (let i = 0; i < HAND_DEFINED_HOLES.length && i < editorHoleCount; i++) {
    customHoleIndices.add(i);
  }
  buildHoleList();
  const btn = document.getElementById('btn-clear');
  btn.textContent = 'Cleared!';
  btn.style.background = '#a44';
  setTimeout(() => { btn.textContent = 'Clear'; btn.style.background = ''; }, 1200);
  console.log('Cleared course data from localStorage');
}

// ── Hole Library ──────────────────────────────────────────

async function loadHoleLibrary() {
  // Try server file first
  try {
    const res = await fetch('data/hole-library.json');
    if (res.ok) {
      holeLibrary = await res.json();
      // Also cache in localStorage
      localStorage.setItem('dg-hole-library', JSON.stringify(holeLibrary));
      console.log('Loaded hole library from server:', Object.keys(holeLibrary).length, 'holes');
      return;
    }
  } catch (e) { /* ignore fetch errors */ }
  // Fallback to localStorage
  try {
    const raw = localStorage.getItem('dg-hole-library');
    if (raw) {
      holeLibrary = JSON.parse(raw);
      console.log('Loaded hole library from localStorage:', Object.keys(holeLibrary).length, 'holes');
      return;
    }
  } catch (e) { /* ignore */ }
  holeLibrary = {};
  console.log('No hole library found, starting empty');
}

function saveHoleLibrary() {
  // Save to server
  fetch('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ file: 'data/hole-library.json', data: holeLibrary }),
  }).then(r => r.json()).then(result => {
    if (result.ok) {
      console.log('Hole library saved to', result.path);
    } else {
      console.error('Hole library server save failed:', result.error);
    }
  }).catch(err => {
    console.error('Hole library server save failed:', err.message);
  });
  // Also write to localStorage as backup
  localStorage.setItem('dg-hole-library', JSON.stringify(holeLibrary));
}

function generateSlug(name) {
  let base = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  if (!base) base = 'hole';
  let slug = base;
  let n = 2;
  while (holeLibrary[slug]) {
    slug = base + '-' + n;
    n++;
  }
  return slug;
}

function generateAutoName() {
  const name = 'Custom Hole ' + nextCustomNumber;
  nextCustomNumber++;
  return name;
}

function onHoleNameChange(val) {
  if (!customHoleIndices.has(currentHole)) return;
  if (!customHoleMeta[currentHole]) customHoleMeta[currentHole] = {};
  customHoleMeta[currentHole].name = val;
  buildHoleList();
}

function onToggleTypeClick() {
  const isCustom = customHoleIndices.has(currentHole);
  if (isCustom) {
    // Revert to auto
    pushUndo();
    customHoleIndices.delete(currentHole);
    delete customHoleMeta[currentHole];
    // Remove objects for this hole
    for (let i = objects.length - 1; i >= 0; i--) {
      if (objects[i].holeIndex === currentHole) objects.splice(i, 1);
    }
    regenerateCurrentHole();
    buildHoleList();
    goToHole(currentHole);
  } else {
    // Show dropdown
    const dd = document.getElementById('custom-dropdown');
    dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
  }
}

function makeCustomNew() {
  document.getElementById('custom-dropdown').style.display = 'none';
  pushUndo();
  customHoleIndices.add(currentHole);
  const name = generateAutoName();
  customHoleMeta[currentHole] = { name: name };
  currentPresetIndex = 0;
  applyPreset(currentPresetIndex);
  buildHoleList();
  goToHole(currentHole);
}

function openLibraryPicker() {
  document.getElementById('custom-dropdown').style.display = 'none';
  libraryPickMode = true;
  toggleLibraryPanel(true);
}

function toggleLibraryPanel(show) {
  const panel = document.getElementById('library-panel');
  if (show) {
    buildLibraryPanel();
    panel.style.display = 'block';
  } else {
    panel.style.display = 'none';
    libraryPickMode = false;
  }
}

function buildLibraryPanel() {
  const list = document.getElementById('library-list');
  const slugs = Object.keys(holeLibrary);
  if (slugs.length === 0) {
    list.innerHTML = '<div style="color:#777; font-size:10px; padding:8px 0;">No holes saved yet. Use "Save Current to Library" below.</div>';
    return;
  }
  list.innerHTML = '';
  for (const slug of slugs) {
    const entry = holeLibrary[slug];
    const div = document.createElement('div');
    div.className = 'lib-item';

    const nameDiv = document.createElement('div');
    nameDiv.className = 'lib-item-name';
    nameDiv.textContent = entry.name || slug;
    div.appendChild(nameDiv);

    const metaDiv = document.createElement('div');
    metaDiv.className = 'lib-item-meta';
    const dist = entry.dist || '?';
    const objCount = entry.objects ? entry.objects.length : 0;
    let metaText = `dist:${dist}`;
    if (objCount > 0) metaText += ` objs:${objCount}`;
    if (entry.createdFrom) metaText += ` fork:${entry.createdFrom}`;
    metaDiv.textContent = metaText;
    div.appendChild(metaDiv);

    const actions = document.createElement('div');
    actions.className = 'lib-item-actions';

    if (libraryPickMode) {
      const useBtn = document.createElement('button');
      useBtn.className = 'ed-btn sm';
      useBtn.textContent = 'Use';
      useBtn.onclick = (e) => { e.stopPropagation(); useLibraryHole(slug); };
      actions.appendChild(useBtn);
    }

    const forkBtn = document.createElement('button');
    forkBtn.className = 'ed-btn sm';
    forkBtn.textContent = 'Fork';
    forkBtn.onclick = (e) => { e.stopPropagation(); forkLibraryHole(slug); };
    actions.appendChild(forkBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'ed-btn sm danger';
    delBtn.textContent = 'Del';
    delBtn.onclick = (e) => { e.stopPropagation(); deleteLibraryHole(slug); };
    actions.appendChild(delBtn);

    div.appendChild(actions);
    list.appendChild(div);
  }
}

function saveCurrentToLibrary() {
  if (!customHoleIndices.has(currentHole)) {
    // Auto-convert to custom first
    customHoleIndices.add(currentHole);
    if (!customHoleMeta[currentHole]) {
      customHoleMeta[currentHole] = { name: generateAutoName() };
    }
  }
  const meta = customHoleMeta[currentHole] || {};
  const defaultName = meta.name || generateAutoName();
  const name = prompt('Name for this library hole:', defaultName);
  if (!name) return;

  const slug = generateSlug(name);
  const def = serializeHole(currentHole);
  if (!def) { alert('Could not serialize current hole.'); return; }

  holeLibrary[slug] = {
    name: name,
    createdFrom: meta.libraryRef || null,
    teeY: def.teeY,
    dist: def.dist,
    cupY: def.cupY,
    verts: def.verts,
    objects: def.objects || [],
  };
  if (def.cupMat) holeLibrary[slug].cupMat = def.cupMat;

  // Update the current hole's libraryRef
  if (!customHoleMeta[currentHole]) customHoleMeta[currentHole] = {};
  customHoleMeta[currentHole].name = name;
  customHoleMeta[currentHole].libraryRef = slug;

  saveHoleLibrary();
  buildLibraryPanel();
  buildHoleList();
  console.log('Saved hole to library as:', slug);
}

function deleteLibraryHole(slug) {
  const entry = holeLibrary[slug];
  if (!entry) return;
  if (!confirm('Delete library hole "' + (entry.name || slug) + '"?')) return;
  delete holeLibrary[slug];
  saveHoleLibrary();
  buildLibraryPanel();
}

function useLibraryHole(slug) {
  const entry = holeLibrary[slug];
  if (!entry) return;

  pushUndo();

  // Mark as custom
  customHoleIndices.add(currentHole);
  customHoleMeta[currentHole] = {
    name: entry.name,
    libraryRef: slug,
  };

  // Apply the library hole's terrain to the current slot
  // We do this by injecting into HAND_DEFINED_HOLES temporarily and regenerating
  const holeDef = {
    teeY: entry.teeY,
    dist: entry.dist,
    cupY: entry.cupY,
    verts: entry.verts ? entry.verts.map(v => ({...v})) : [],
    objects: entry.objects ? entry.objects.map(o => ({
      mat: o.mat,
      verts: o.verts.map(v => ({...v})),
      sprite: o.sprite,
      rotation: o.rotation,
    })) : [],
  };
  if (entry.cupMat) holeDef.cupMat = entry.cupMat;

  // Store in localStorage custom holes so the generator picks it up
  const customHolesRaw = localStorage.getItem('desert-golfing-custom-holes');
  let customHoles = {};
  try { if (customHolesRaw) customHoles = JSON.parse(customHolesRaw); } catch(e) {}
  customHoles[String(currentHole)] = holeDef;
  localStorage.setItem('desert-golfing-custom-holes', JSON.stringify(customHoles));
  invalidateCustomHolesCache();

  // Regenerate terrain for this hole
  const savedLength = holes.length;
  const hole = holes[currentHole];
  if (hole) {
    // Remove vertices in this hole's range
    const teeX = hole.teeX;
    const startX = teeX + 40;
    const nextHole = currentHole < holes.length - 1 ? holes[currentHole + 1] : null;
    const endX = nextHole ? nextHole.teeX + 40 : hole.cupX + 200;
    vertices = vertices.filter(v => v.x < startX || v.x > endX);
  }
  holes.length = currentHole;
  generateHoleTerrain(currentHole);
  if (savedLength > currentHole + 1) {
    ensureHolesAhead(savedLength - 1);
  }

  toggleLibraryPanel(false);
  buildHoleList();
  goToHole(currentHole);
}

function forkLibraryHole(slug) {
  const entry = holeLibrary[slug];
  if (!entry) return;
  const name = prompt('Name for forked hole:', entry.name + ' (fork)');
  if (!name) return;

  const newSlug = generateSlug(name);
  holeLibrary[newSlug] = {
    name: name,
    createdFrom: slug,
    teeY: entry.teeY,
    dist: entry.dist,
    cupY: entry.cupY,
    verts: entry.verts ? entry.verts.map(v => ({...v})) : [],
    objects: entry.objects ? entry.objects.map(o => ({
      mat: o.mat,
      verts: o.verts.map(v => ({...v})),
      sprite: o.sprite,
      rotation: o.rotation,
    })) : [],
  };
  if (entry.cupMat) holeLibrary[newSlug].cupMat = entry.cupMat;

  saveHoleLibrary();
  buildLibraryPanel();

  // If in pick mode, use the fork immediately
  if (libraryPickMode) {
    useLibraryHole(newSlug);
  }
}

// ── Shot Loop — ghost ball management ─────────────────────
function spawnGhostBall() {
  const hole = holes[currentHole];
  if (!hole) return null;
  const teeY = terrainYAt(hole.teeX) - BALL_RADIUS;
  return {
    x: hole.teeX, y: teeY,
    vx: ed.shotLoop.vx, vy: ed.shotLoop.vy,
    onGround: false, atRest: false, slowFrames: 0,
    spin: ed.shotLoop.spin, spinAim: 0, rotation: 0,
    lastCollidedMat: null, lastCollisionNormal: null,
    lastCollisionY: null, lastCollisionSource: 'terrain',
    dead: false, age: 0,
  };
}

function updateShotLoop() {
  const loop = ed.shotLoop;
  if (!loop.active || !loop.hasShot) return;

  // Spawn new balls on timer
  loop.spawnTimer++;
  if (loop.spawnTimer >= loop.spawnInterval) {
    loop.spawnTimer = 0;
    if (loop.balls.length < loop.maxBalls) {
      loop.balls.push(spawnGhostBall());
    }
  }

  // Update each ghost ball by temporarily swapping global ball
  const realBall = ball;
  const realState = state;
  for (let i = loop.balls.length - 1; i >= 0; i--) {
    const gb = loop.balls[i];
    if (gb.dead) { loop.balls.splice(i, 1); continue; }

    // Swap global ball with ghost ball
    ball = gb;
    state = STATE_FLIGHT;

    // Run physics (same as updatePhysics)
    if (!ball.atRest) {
      ball.rotation += ball.onGround ? ball.vx / BALL_RADIUS : ball.spin * 0.3;
      const substeps = 2;
      for (let s = 0; s < substeps; s++) {
        ball.vy += GRAVITY / substeps;
        ball.x += ball.vx / substeps;
        ball.y += ball.vy / substeps;
        MODE.collide();
      }
      // Spin decay in air
      if (!ball.onGround && Math.abs(ball.spin) > 0.001) {
        ball.spin *= SPIN_AIR_DECAY;
        if (Math.abs(ball.spin) < 0.001) ball.spin = 0;
      }
      // Friction on ground
      if (ball.onGround) {
        const mat = ball.lastCollidedMat ? MATERIALS[ball.lastCollidedMat] : MATERIALS[DEFAULT_MAT];
        let effRoll = mat.rollingFriction;
        if (Math.abs(ball.spin) > 0.01) {
          const spinEffect = ball.spin * (Math.sign(ball.vx) || 1);
          effRoll = Math.min(0.999, Math.max(0.85, effRoll + spinEffect * SPIN_ROLL_FACTOR));
        }
        ball.vx *= effRoll;
        ball.vy *= effRoll;
        const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
        if (speed > mat.surfaceFriction) {
          ball.vx -= (ball.vx / speed) * mat.surfaceFriction;
          ball.vy -= (ball.vy / speed) * mat.surfaceFriction;
        }
        if (Math.abs(ball.spin) > 0.001) {
          ball.spin *= SPIN_GROUND_DECAY;
          if (Math.abs(ball.spin) < 0.001) ball.spin = 0;
        }
        if (speed < 0.5) ball.slowFrames++;
        else ball.slowFrames = 0;
        if (speed < 0.05 || ball.slowFrames > 120) {
          ball.vx = 0; ball.vy = 0; ball.atRest = true;
          ball.spin = 0; ball.slowFrames = 0;
        }
      }
    }

    // Check if ghost ball should be removed (at rest, in cup, fallen off world, or old)
    gb.age++;
    if (gb.atRest || gb.age > 600) gb.dead = true;
    // Don't use isBallOffScreen (it checks editor camera viewport).
    // Instead check if ball has fallen far below terrain or gone very far
    if (gb.y > H + 300 || gb.y < -200) gb.dead = true;
    if (isBallInCup()) gb.dead = true;
  }

  // Restore real ball
  ball = realBall;
  state = realState;
}

function drawGhostBalls() {
  const loop = ed.shotLoop;
  if (!loop.active || loop.balls.length === 0) return;

  // Ghost balls drawn in world coords (camera transform already applied by draw())
  for (const gb of loop.balls) {
    if (gb.dead) continue;
    // Fade based on age
    const alpha = Math.max(0.15, 1 - gb.age / 500);
    ctx.globalAlpha = alpha * 0.7;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(gb.x, gb.y, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    // Rotation dots
    const dotR = BALL_RADIUS * 0.55;
    const dotSize = BALL_RADIUS * 0.18;
    ctx.fillStyle = `rgba(140, 135, 120, ${alpha * 0.4})`;
    for (let i = 0; i < 3; i++) {
      const angle = gb.rotation + i * (Math.PI * 2 / 3);
      ctx.beginPath();
      ctx.arc(gb.x + Math.cos(angle) * dotR, gb.y + Math.sin(angle) * dotR, dotSize, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawShotLoopAimLine() {
  // Draw aim line when user is aiming in shot loop mode
  const loop = ed.shotLoop;
  if (!loop.aiming) return;

  const hole = holes[currentHole];
  if (!hole) return;
  const teeX = hole.teeX;
  const teeY = terrainYAt(teeX) - BALL_RADIUS;

  const dx = loop.aimStartX - loop.aimCurrentX;
  const dy = loop.aimStartY - loop.aimCurrentY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 5) return;

  const power = Math.min(dist * POWER_SCALE, MAX_POWER);
  const angle = Math.atan2(dy, dx);
  const lineLen = power * 15; // visual length

  ctx.strokeStyle = 'rgba(255, 100, 100, 0.7)';
  ctx.lineWidth = 2 / ed.zoom;
  ctx.setLineDash([6 / ed.zoom, 4 / ed.zoom]);
  ctx.beginPath();
  ctx.moveTo(teeX, teeY);
  ctx.lineTo(teeX + Math.cos(angle) * lineLen, teeY + Math.sin(angle) * lineLen);
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw small circle at tee
  ctx.strokeStyle = 'rgba(255, 100, 100, 0.9)';
  ctx.lineWidth = 1.5 / ed.zoom;
  ctx.beginPath();
  ctx.arc(teeX, teeY, BALL_RADIUS + 3, 0, Math.PI * 2);
  ctx.stroke();
}

let _lastTrackedHole = 0;

function editorGameLoop() {
  _ballLogFrame++;

  // Only run game update in play mode
  if (ed.mode === 'play') {
    update();
    // Detect hole transitions and update sidebar
    if (currentHole !== _lastTrackedHole) {
      _lastTrackedHole = currentHole;
      buildHoleList();
    }
  }

  // Update shot loop ghost balls
  if (ed.mode === 'edit') {
    updateShotLoop();
    updateModeBadge();
  }

  // Always use the real renderer
  draw();

  // Draw ghost balls (in world coords, after draw() which applies camera)
  if (ed.mode === 'edit' && ed.shotLoop.active) {
    ctx.save();
    ctx.scale(displayScale, displayScale);
    MODE.applyCameraTransform(ctx);
    drawGhostBalls();
    drawShotLoopAimLine();
    ctx.restore();
  }

  // Then object editor UI on top
  drawEditorObjects();

  requestAnimationFrame(editorGameLoop);
}

// ── Start ─────────────────────────────────────────────────
editorInit();
editorGameLoop();
</script>
