<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Desert Golfing</title>
<style>
  @font-face {
    font-family: 'Departure Mono';
    src: url('assets/fonts/DepartureMono-Regular.woff2') format('woff2'),
         url('assets/fonts/DepartureMono-Regular.woff') format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #d5ad72; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; }
  #branch-label {
    position: fixed; top: 6px; right: 10px;
    font: 11px 'Departure Mono', monospace;
    color: rgba(255,255,255,0.3);
    pointer-events: none; z-index: 100;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="branch-label"></div>
<script>
  // Auto-detect branch from branch.json (generated by build/serve scripts)
  // Falls back to empty if not available — keeps index.html identical across branches
  // Only try branch.json on localhost (avoids 404 noise on GitHub Pages)
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
  fetch('branch.json').then(r => r.ok ? r.json() : null).catch(() => null).then(d => {
    if (!d) return;
    if (d.branch && d.branch !== 'main') {
      document.getElementById('branch-label').textContent = d.branch.toUpperCase().replace(/-/g, ' ');
      document.title = d.branch.toUpperCase().replace(/-/g, ' ') + ' — Desert Golfing';
    }
  }).catch(() => {});
  }
</script>
<script src="src/shared.js"></script>
<script src="src/worlds/desert-planet.js"></script>
<script src="src/level-design.js"></script>
<script src="src/worlds/mars.js"></script>
<script src="src/modes/desert-golfing.js"></script>
<script src="src/art.js"></script>
<script src="src/gameplay.js"></script>
<script src="src/debug.js"></script>
<script src="src/main.js"></script>
</body>
</html>
