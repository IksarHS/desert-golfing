<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Desert Golfing</title>
<style>
  @font-face {
    font-family: 'Departure Mono';
    src: url('assets/fonts/DepartureMono-Regular.woff2') format('woff2'),
         url('assets/fonts/DepartureMono-Regular.woff') format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #d5ad72; margin: 0; padding: 0; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; position: relative; z-index: 1; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<div id="loading" style="position:fixed;inset:0;background:#d5ad72;z-index:9999;display:flex;align-items:center;justify-content:center;">
  <span style="font:48px 'Departure Mono',monospace;color:rgba(255,255,255,0.7);">Loading...</span>
</div>
<canvas id="c" style="visibility:hidden;"></canvas>
<div id="auth-ui" style="position:fixed;top:8px;right:10px;z-index:9999;font-family:'Departure Mono',monospace;display:none;">
  <!-- Login/Register Form (shown when not signed in) -->
  <div id="auth-form" style="background:rgba(20,16,12,0.75);border:1px solid rgba(232,160,48,0.25);border-radius:4px;padding:8px 10px;min-width:180px;">
    <div id="auth-login-username-row" style="margin-bottom:4px;">
      <input id="auth-login-username" type="text" placeholder="username" maxlength="20"
        style="width:100%;box-sizing:border-box;font:11px 'Departure Mono',monospace;background:rgba(0,0,0,0.3);color:#e8d0a0;border:1px solid rgba(232,160,48,0.3);border-radius:2px;padding:4px 6px;outline:none;">
    </div>
    <div id="auth-username-row" style="display:none;margin-bottom:4px;">
      <input id="auth-username" type="text" placeholder="username" maxlength="20"
        style="width:100%;box-sizing:border-box;font:11px 'Departure Mono',monospace;background:rgba(0,0,0,0.3);color:#e8d0a0;border:1px solid rgba(232,160,48,0.3);border-radius:2px;padding:4px 6px;outline:none;">
    </div>
    <div id="auth-email-row" style="display:none;margin-bottom:4px;">
      <input id="auth-email" type="email" placeholder="email"
        style="width:100%;box-sizing:border-box;font:11px 'Departure Mono',monospace;background:rgba(0,0,0,0.3);color:#e8d0a0;border:1px solid rgba(232,160,48,0.3);border-radius:2px;padding:4px 6px;outline:none;">
    </div>
    <div style="margin-bottom:6px;">
      <input id="auth-password" type="password" placeholder="password"
        style="width:100%;box-sizing:border-box;font:11px 'Departure Mono',monospace;background:rgba(0,0,0,0.3);color:#e8d0a0;border:1px solid rgba(232,160,48,0.3);border-radius:2px;padding:4px 6px;outline:none;">
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <button id="auth-submit" onclick="loginWithUsername()"
        style="font:10px 'Departure Mono',monospace;background:rgba(232,160,48,0.25);color:#e8a030;border:1px solid rgba(232,160,48,0.4);border-radius:2px;padding:3px 10px;cursor:pointer;">Login</button>
      <span id="auth-toggle" style="font-size:10px;color:rgba(232,160,48,0.6);">
        <a href="#" onclick="setAuthMode('register');return false" style="color:rgba(232,160,48,0.6);text-decoration:none;">Register</a>
      </span>
    </div>
    <div id="auth-error" style="display:none;font-size:9px;color:#e84040;margin-top:4px;line-height:1.3;"></div>
  </div>
  <!-- Signed-in display -->
  <div id="auth-signed-in" style="display:none;align-items:center;gap:8px;font-size:11px;">
    <span style="color:rgba(232,160,48,0.7);">Player:</span>
    <span id="auth-display-name" style="color:#e8d0a0;"></span>
    <a href="#" onclick="signOut();return false" style="color:rgba(255,255,255,0.3);font-size:9px;text-decoration:none;margin-left:4px;">sign out</a>
  </div>
</div>

<!-- Autoplay controls — bottom-left -->
<div id="autoplay-panel" style="position:fixed;bottom:12px;left:12px;z-index:9999;font-family:'Departure Mono',monospace;display:flex;align-items:center;gap:6px;">
  <button id="ap-toggle" class="off" onclick="toggleAutoplay()" style="
    padding:4px 10px;border-radius:4px;font:12px 'Departure Mono',monospace;
    cursor:pointer;border:1px solid rgba(255,255,255,0.15);letter-spacing:0.5px;
    background:rgba(255,255,255,0.06);color:#777;transition:all 0.15s;
  ">OFF</button>
  <div style="display:flex;gap:2px;">
    <button class="ap-speed active" data-speed="1" onclick="setAutoplaySpeed(1)" style="padding:3px 6px;border-radius:3px;font:10px 'Departure Mono',monospace;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#777;">1x</button>
    <button class="ap-speed" data-speed="2" onclick="setAutoplaySpeed(2)" style="padding:3px 6px;border-radius:3px;font:10px 'Departure Mono',monospace;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#777;">2x</button>
    <button class="ap-speed" data-speed="4" onclick="setAutoplaySpeed(4)" style="padding:3px 6px;border-radius:3px;font:10px 'Departure Mono',monospace;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#777;">4x</button>
    <button class="ap-speed" data-speed="8" onclick="setAutoplaySpeed(8)" style="padding:3px 6px;border-radius:3px;font:10px 'Departure Mono',monospace;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#777;">8x</button>
  </div>
</div>
<style>
  #ap-toggle.on { background:rgba(100,200,120,0.2);border-color:rgba(100,200,120,0.5);color:#8e8; }
  .ap-speed.active { border-color:rgba(100,200,120,0.5);color:#fff;background:rgba(100,200,120,0.15); }
  .ap-speed:hover, #ap-toggle:hover { background:rgba(255,255,255,0.1); }
  #autoplay-panel button { outline:none; }
</style>
<script>
  // Prevent autoplay panel clicks from triggering game aim
  document.getElementById('autoplay-panel').addEventListener('mousedown', function(e) { e.stopPropagation(); });
  document.getElementById('autoplay-panel').addEventListener('touchstart', function(e) { e.stopPropagation(); });
</script>

<!-- Menu button — bottom-right -->
<button id="menu-btn" onclick="toggleMenu()" style="
  position:fixed;bottom:12px;right:12px;z-index:9999;
  padding:4px 10px;border-radius:4px;font:12px 'Departure Mono',monospace;
  cursor:pointer;border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06);color:#999;outline:none;
">☰ Map</button>

<!-- Collection / Discovery overlay -->
<div id="menu-overlay" style="display:none;position:fixed;inset:0;z-index:10000;">
  <div id="menu-content"></div>
  <button onclick="toggleMenu()" style="
    position:absolute;top:16px;right:16px;background:none;border:none;
    color:#777;font:20px 'Departure Mono',monospace;cursor:pointer;
  ">✕</button>
</div>
<style>
  #menu-overlay {
    background:rgba(18,14,10,0.92);backdrop-filter:blur(12px);
    font-family:'Departure Mono',monospace;color:#ddd;
    overflow-y:auto;opacity:0;transition:opacity 0.25s;
  }
  #menu-overlay.open { opacity:1; }
  #menu-content { max-width:700px;margin:0 auto;padding:40px 24px 60px; }
  .menu-stats {
    font-size:12px;color:#888;margin-bottom:24px;padding-bottom:12px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .stat-sep { color:#444;margin:0 6px; }
  .menu-system { margin-bottom:28px; }
  .menu-system-header {
    font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
    color:rgba(232,160,48,0.5);margin-bottom:8px;
  }
  .menu-world { margin-bottom:16px; }
  .menu-world-header { margin-bottom:6px; }
  .world-name { font-size:16px;color:#e8a030;font-weight:bold; }
  .menu-courses { display:flex;flex-direction:column;gap:4px; }
  .menu-course {
    display:flex;align-items:center;gap:12px;padding:10px 14px;
    border-radius:8px;background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.04);
    transition:background 0.15s;
  }
  .menu-course:hover { background:rgba(255,255,255,0.06); }
  .menu-course.current { border-color:rgba(232,160,48,0.3);background:rgba(232,160,48,0.08); }
  .menu-course.locked { opacity:0.4; }
  .menu-course.completed .course-name { color:#8c8; }
  .course-info { flex:1; }
  .course-name { font-size:13px;color:#ddd;display:block; }
  .course-meta { font-size:10px;color:#666;display:block;margin-top:2px; }
  .course-btn {
    padding:5px 14px;border-radius:6px;font:11px 'Departure Mono',monospace;
    cursor:pointer;border:1px solid rgba(232,160,48,0.4);
    background:rgba(232,160,48,0.15);color:#e8a030;
    transition:all 0.15s;outline:none;
  }
  .course-btn:hover { background:rgba(232,160,48,0.3); }
  .course-btn.replay { border-color:rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#aaa; }
  .course-btn.replay:hover { background:rgba(255,255,255,0.1);color:#fff; }
  .course-lock { font-size:14px;opacity:0.3; }
  .lb-panel {
    width:100%;margin-top:8px;padding:8px 12px;
    background:rgba(0,0,0,0.2);border-radius:6px;
    border:1px solid rgba(255,255,255,0.04);
  }
  .lb-header { font-size:10px;color:#e8a030;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px; }
  .lb-row { display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px;color:#999; }
  .lb-row.me { color:#e8a030; }
  .lb-rank { color:#555;min-width:20px; }
  .lb-name { flex:1; }
  .lb-score { font-weight:bold;color:#ddd; }
  .lb-row.me .lb-score { color:#e8a030; }
</style>
<script>
  document.getElementById('menu-overlay').addEventListener('mousedown', function(e) { e.stopPropagation(); });
  document.getElementById('menu-overlay').addEventListener('touchstart', function(e) { e.stopPropagation(); });
  document.getElementById('menu-btn').addEventListener('mousedown', function(e) { e.stopPropagation(); });
</script>

<script>
  // Prevent auth form inputs from propagating keys to the game
  document.getElementById('auth-form').addEventListener('keydown', function(e) {
    e.stopPropagation();
    if (e.key === 'Enter') {
      document.getElementById('auth-submit').click();
    }
  });
  document.getElementById('auth-ui').addEventListener('mousedown', function(e) { e.stopPropagation(); });
  document.getElementById('auth-ui').addEventListener('touchstart', function(e) { e.stopPropagation(); });

  // Auto-detect branch (localhost only)
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    fetch('branch.json').then(r => r.ok ? r.json() : null).catch(() => null).then(d => {
      if (!d) return;
      if (d.branch && d.branch !== 'main') {
        document.getElementById('branch-label').textContent = d.branch.toUpperCase().replace(/-/g, ' ');
        document.title = d.branch.toUpperCase().replace(/-/g, ' ') + ' — Desert Golfing';
      }
    }).catch(() => {});
  }
</script>
<!-- Firebase CDN (compat mode for no-bundler setup) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="src/firebase.js"></script>
<script src="src/shared.js"></script>
<script src="src/worlds/desert-planet.js"></script>
<script src="src/worlds/grasslands.js"></script>
<script src="src/worlds/classic-collection.js"></script>
<script src="src/worlds/dramatic-depths.js"></script>
<script src="src/worlds/frozen-wastes.js"></script>
<script src="src/worlds/mudlands.js"></script>
<script src="src/reference-holes.js"></script>
<script src="src/level-design.js"></script>
<script src="src/generators/midgame.js"></script>
<script src="src/generators/dramatic.js"></script>
<script src="src/modes/desert-golfing.js"></script>
<script src="src/art.js"></script>
<script src="src/gameplay.js"></script>
<script src="src/debug.js"></script>
<script src="src/leaderboard.js"></script>
<script src="src/autoplay.js"></script>
<script src="src/menu.js"></script>
<script src="src/main.js"></script>
</body>
</html>
